<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Connect Salwa IPTV</title>
  <style>
    *{box-sizing:border-box}body{font:16px system-ui,sans-serif;background:linear-gradient(135deg,#4932be,#cb647b);color:#fff;min-height:100vh;margin:0;padding:24px}
    main{max-width:520px;margin:0 auto;background:#171d32;padding:28px;border-radius:24px;box-shadow:0 18px 40px #17112b55}h1{margin:0 0 10px;font-size:28px}p{line-height:1.5;color:#d9e0f1}
    label{display:block;margin-top:16px;font-weight:600}input{display:block;width:100%;padding:13px;margin-top:6px;border:2px solid #7e91b5;border-radius:10px;font:inherit}
    fieldset{border:0;margin:18px 0 0;padding:0}legend{font-weight:700;margin-bottom:10px}.mode-options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mode-options label{margin:0;padding:14px;border:2px solid #7e91b5;border-radius:12px;cursor:pointer}.mode-options label:has(input:checked){border-color:#ffe37a;background:#244b96}.mode-options input{display:inline;width:auto;margin:0 8px 0 0}section[hidden]{display:none}
    button{width:100%;margin-top:24px;padding:15px;border:0;border-radius:12px;background:#acc8ff;color:#132348;font:700 18px system-ui;cursor:pointer}button:disabled{opacity:.55}
    #status{min-height:28px;color:#ffe37a}small{display:block;margin-top:18px;color:#cbd5e1;line-height:1.4}
  </style>
</head>
<body>
  <main>
    <h1>Connect Salwa IPTV</h1>
    <p>Choose M3U or Xtream, enter your playlist details, then confirm them on the TV. The details are encrypted on this phone before transfer.</p>
    <form id="form" autocomplete="off">
      <fieldset><legend>Playlist type</legend><div class="mode-options">
        <label><input type="radio" name="mode" value="m3u" required>M3U Playlist</label>
        <label><input type="radio" name="mode" value="xtream" required>Xtream Codes</label>
      </div></fieldset>
      <label>Playlist name<input name="title" maxlength="100" required></label>
      <section id="m3uFields" hidden><label>M3U URL<input name="url" type="url" maxlength="1800" placeholder="https://provider.example/playlist.m3u" disabled required></label></section>
      <section id="xtreamFields" hidden>
        <label>Server URL<input name="server" type="url" maxlength="1000" placeholder="https://provider.example" disabled required></label>
        <label>Username<input name="username" maxlength="256" disabled required></label>
        <label>Password<input name="password" type="password" maxlength="256" disabled required></label>
      </section>
      <button id="send" type="submit" disabled>Send to TV</button>
    </form>
    <p id="status" role="status"></p>
    <small>This one-time pairing link expires after five minutes. Only encrypted data is sent through the temporary relay.</small>
  </main>
  <script>
    'use strict';
    const form = document.getElementById('form');
    const status = document.getElementById('status');
    const button = document.getElementById('send');
    const m3uFields = document.getElementById('m3uFields');
    const xtreamFields = document.getElementById('xtreamFields');
    const params = new URLSearchParams(location.hash.slice(1));
    const topic = params.get('t') || '';
    const keyText = params.get('k') || '';
    const expiry = Number(params.get('e'));
    const bytes = text => Uint8Array.from(atob(text.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
    const encode = data => btoa(String.fromCharCode(...new Uint8Array(data)));
    const valid = /^[a-z0-9-]{20,80}$/.test(topic) && /^[A-Za-z0-9_-]{43}$/.test(keyText) && Number.isFinite(expiry) && expiry > Date.now();
    if (!valid || !crypto.subtle) {
      form.hidden = true;
      status.textContent = 'This pairing link is invalid or expired. Start again on the TV.';
    }
    function showMode() {
      const mode = form.elements.mode.value;
      m3uFields.hidden = mode !== 'm3u';
      xtreamFields.hidden = mode !== 'xtream';
      for (const input of m3uFields.querySelectorAll('input')) input.disabled = mode !== 'm3u';
      for (const input of xtreamFields.querySelectorAll('input')) input.disabled = mode !== 'xtream';
      button.disabled = !valid || !mode;
      status.textContent = '';
    }
    form.addEventListener('change', event => { if (event.target.name === 'mode') showMode(); });
    function buildPayload(data) {
      const title = String(data.title || '').trim();
      if (!title || title.length > 100) throw new Error('Enter a playlist name.');
      const mode = data.mode;
      const rawUrl = mode === 'm3u' ? data.url : data.server;
      let url;
      try { url = new URL(rawUrl); } catch (_) { throw new Error('Enter a valid HTTP or HTTPS URL.'); }
      if (!['http:', 'https:'].includes(url.protocol) || !url.hostname) throw new Error('Enter a valid HTTP or HTTPS URL.');
      if (mode === 'm3u') {
        if (rawUrl.length > 1800) throw new Error('M3U URL is too long.');
        return { v: 2, kind: 'm3u', title, url: url.href };
      }
      if (mode === 'xtream') {
        const username = String(data.username || '').trim();
        const password = String(data.password || '');
        if (rawUrl.length > 1000 || !username || username.length > 256 || !password || password.length > 256) {
          throw new Error('Check the server URL, username, and password.');
        }
        return { v: 2, kind: 'xtream', title, server: url.href, username, password };
      }
      throw new Error('Choose M3U or Xtream.');
    }
    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (!valid || Date.now() >= expiry) { status.textContent = 'Link expired. Start again on the TV.'; return; }
      let payload;
      try { payload = buildPayload(Object.fromEntries(new FormData(form))); }
      catch (error) { status.textContent = error.message; return; }
      button.disabled = true;
      status.textContent = 'Encrypting and sending…';
      try {
        const key = await crypto.subtle.importKey('raw', bytes(keyText), 'AES-GCM', false, ['encrypt']);
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const plain = new TextEncoder().encode(JSON.stringify(payload));
        const ciphertext = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, plain);
        const body = JSON.stringify({ v: 1, iv: encode(iv), data: encode(ciphertext) });
        if (body.length > 4000) throw new Error('Playlist details are too long.');
        const response = await fetch(`https://ntfy.sh/${topic}`, { method: 'POST', body });
        if (!response.ok) throw new Error('The relay is unavailable. Try again.');
        form.reset(); form.hidden = true;
        status.textContent = 'Sent. Review and confirm the playlist on your TV.';
      } catch (error) { status.textContent = error.message || 'Could not send. Try again.'; button.disabled = false; }
    });
  </script>
</body>
</html>
