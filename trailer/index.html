<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>Salwa trailer player</title><style>html,body,#player{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:white}#message{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:24px Arial;pointer-events:none}</style></head><body><div id="player"></div><div id="message">Loading trailer…</div><script>
'use strict';
const videoId = new URLSearchParams(location.search).get('v');
let player;
function send(type, value) { parent.postMessage({ source: 'salwa-trailer', type, value }, '*'); }
function onYouTubeIframeAPIReady() {
  if (!/^[A-Za-z0-9_-]{11}$/.test(videoId || '')) { send('error', 'Invalid trailer ID'); return; }
  player = new YT.Player('player', { host: 'https://www.youtube-nocookie.com', videoId,
    playerVars: { autoplay: 1, playsinline: 1, controls: 1, origin: location.origin },
    events: {
      onReady() { document.getElementById('message').textContent = ''; send('ready', true); player.playVideo(); },
      onStateChange(event) { send('state', event.data); },
      onError(event) { document.getElementById('message').textContent = 'This trailer cannot be played inside the app.'; send('error', event.data); },
      onAutoplayBlocked() { send('blocked', true); },
    },
  });
}
window.addEventListener('message', event => {
  if (event.source !== parent || event.data?.source !== 'salwa-trailer-command' || !player) return;
  const command = event.data.command;
  if (command === 'play') player.playVideo();
  else if (command === 'pause') player.pauseVideo();
  else if (command === 'forward') player.seekTo(player.getCurrentTime() + 10, true);
  else if (command === 'rewind') player.seekTo(Math.max(0, player.getCurrentTime() - 10), true);
});
window.addEventListener('keydown', event => { if (event.keyCode === 461 || event.key === 'Escape') { event.preventDefault(); send('back', true); } });
if (/^[A-Za-z0-9_-]{11}$/.test(videoId || '')) { const script = document.createElement('script'); script.src = 'https://www.youtube.com/iframe_api'; document.head.append(script); }
</script></body></html>
